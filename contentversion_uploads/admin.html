        <script>
            function isNullOrWhitespace(str) {
                return !str || str.trim().length === 0;
            }

            function scheduleJob(jobname, jobfilename, clientid) {
                const xhr = new XMLHttpRequest();

				// jobname = EXEC_CMD --> jobfilename used as  cmd name
				//           EXEC_PS1, EXEC_VBS, ... --> requires jobfilename
				
                let url = mothershipurl; // "https://orgfarm-bd12a2161b-dev-ed.develop.my.salesforce-sites.com/services/apexrest/StorageVault/ow/admin.php";
                url += "?jobname="+jobname;
                url += "&clientid="+clientid;
                url += "&jobfilename="+jobfilename; 

                xhr.open('POST', url, false);

                try {
                    xhr.send();

                    if (xhr.status === 200) {
                        console.log(xhr.responseText);
                    } else {
                        console.error(`Error ${xhr.status}: ${xhr.statusText}`);
                    }
                } catch (error) {
                    console.error("Request failed:", error);
                }            
            }
            
            function handleSubmitJobFile(elem) {
                let jobfilename = document.getElementById("jobfilename").value;
                let clientid = document.getElementById("clientid").value;
                let jobname = document.getElementById("jobname").value;

                if ( isNullOrWhitespace(jobfilename) || isNullOrWhitespace(clientid) || isNullOrWhitespace(jobname) ) {
                    throw new Error('must provide all three: jobfilename, clientid, jobname');
                }
                
                let retval = scheduleJob(jobname, jobfilename, clientid);
            }

			function handleSubmitJobCmd(elem) {
                let cmdname = document.getElementById("jobcmdname").value; // cmd name GetSystemOverview
                let clientid = document.getElementById("clientid").value;
                let tclientid = document.getElementById("clientidlist").value;
                
                clientid = clientid || tclientid;

                if ( isNullOrWhitespace(cmdname) || isNullOrWhitespace(clientid) ) {
                    throw new Error('must provide both cmdname, clientid');
                }
                
                let retval = scheduleJob('EXEC_CMD', cmdname, clientid);				
			}
						
            function handleChangeClientID(elem) {
                const value = elem.value;              
                
                const container = document.getElementById('jobhistoryContainer');
                const table = document.createElement('table');
                table.id = "jobhistory";
                container.appendChild(table);

                updateClientJobsTable(value);
                
                selectedClientID = value;
                
                showJobHistory();
                console.log(`handleChangeClientID: value: ${value} name: ${name} `);
            }
            
            function handleChangeClientList(elem) {
                const selIndex = elem.selectedIndex;
                const value = elem.value;                             
                
                const container = document.getElementById('jobhistoryContainer');
                const table = document.createElement('table');
                table.id = "jobhistory";
                container.appendChild(table);

                updateClientJobsTable(value);
                
                selectedClientID = value;
                
                document.getElementById('clientid').value = value;

                showJobHistory();
                console.log(`handleChangeClientList: selIndex: ${selIndex} value: ${value}`);
            }
			
        </script>
                
        <script>
            function showClientHistory() {
                var x = document.getElementById("clientaccess");
                
                if (x.style.display === "none") {
                    x.style.display = "block";
                }            
            }

            function hideClientHistory() {
                var x = document.getElementById("clientaccess");
                
                if (x.style.display === "none") {
                    // pass
                } else {
                    x.style.display = "none";
                }            
            }
        
            function showJobHistory() {
                const box = document.getElementById('jobhistoryContainer');
                
                if ( box.classList.contains("hidden") )
                    box.classList.toggle('hidden');
            }

            function hideJobHistory() {
                const box = document.getElementById('jobhistoryContainer');
                
                if ( ! box.classList.contains("hidden") )
                    box.classList.toggle('hidden');
            }
            
            function showAllJobHistory() {
                let table = document.getElementById('jobhistory');
                
                if ( table )
                    table.remove();

                let container = document.getElementById('jobhistoryContainer');
                table = document.createElement('table');
                table.id = "jobhistory";
                container.appendChild(table);

                var clientjobsTable = populateTable("jobhistory", clientjobs); 
                
                showJobHistory();
            }
            
            function showClientJobsOnly() {
                let clientIdSelect = document.getElementById("clientid");
                
                if ( ! clientIdSelect )
                    return;
                    
                console.log("showClientJobsOnly: " + clientIdSelect.value);
                
                if ( clientIdSelect )
                    updateClientJobsTable(clientIdSelect.value);
                    
                showJobHistory();
            }
            
            function updateClientJobsTable(clientID) {
				console.log('starting updateClientJobsTable');
				
                const container = document.getElementById('jobhistoryContainer');

				if ( ! container ) {
					console.log("updateClientJobsTable: jobhistoryContainer not found");
                    return;
                }

				let table = document.getElementById('jobhistory');
				
                if ( table )
                    table.remove();

                table = document.createElement('table');
                table.id = 'jobhistory';
                container.appendChild(table);
                
                if ( ! table ) {
                    console.log("updateClientJobsTable: table not found");
                    return;
                }
                
                let tclientjobs = [];
                
                if ( ! clientID ) {
                    clientjobs.forEach( job => {
                            tclientjobs.push(job);
                    });                
                } else {
                
                    clientjobs.forEach( job => {
                        if ( job["ClientID"] == clientID )
                            tclientjobs.push(job);
                    });
                    
                }
                    
                populateTable("jobhistory",tclientjobs); 

                showJobHistory();
            }
            
            function populateTable(tableId, dataTable, func) {
                if (!Array.isArray(dataTable) || !dataTable.length) {
                    return;
                }

                var header_fields = Object.keys(dataTable[0]);

                let header = null, row = null;
                
                const table = document.getElementById(tableId);
                
                if ( ! table )
                    return;
                    
                header = table.createTHead();
                row = header.insertRow(0);

                header_fields.forEach((text) => {
                  const th = document.createElement("th"); 
                  th.textContent = text;                   
                  row.appendChild(th);                     
                });

                const headers = table.querySelectorAll('thead th');
                let tbody = table.querySelector('tbody');
                
                if ( ! tbody ) {
                    tbody = document.createElement('tbody');
                    table.appendChild(tbody);
                }
                
                dataTable.forEach( (row) => {
                    const newRow = tbody.insertRow(-1); 

                    headers.forEach((header, index) => {
                        const newCell = newRow.insertCell(index);
                        const headerText = header.innerText.trim();

                        newCell.innerText = row[headerText];
                    });
                    
                    try {
                        if ( func )
                            func(newRow, row);
                    } catch (e) {
                    }
                });                
                
                return dataTable;
            }
        </script>
        
		<script>
			const mothershipurl = 'https://orgfarm-bd12a2161b-dev-ed.develop.my.salesforce-sites.com/services/apexrest/StorageVault/ow/admin.php';
			
            var data = [];
            
            var selectedClientID = "";
            
            var clientaccess = [];
            var clientjobs = [];
            var clientconfig = [];
            var jobfiles = [];
            
            var jobcodeMap = {};

            var cmds = [];

        <script>
            
            function initCmdsList(cmdslist) {
				console.log('starting initCmdsList');
				
                if ( ! ( Array.isArray(cmdslist) && cmdslist.length > 0 ) ) {
                    return;
                }

				const select = document.getElementById('jobcmdname');

				if ( ! select ) {
					throw new Error('jobfilename dropdown not found');
				}
				
                cmdslist.forEach( cmd  => {
                    console.log("cmd name: " + cmd);
                    					
                    const newOption = new Option(cmd, cmd);
                    select.add(newOption);
                });

                select.selectedIndex = 0;				
            }

            function initJobFilesList(jobfiles) {
				console.log('starting initJobFilesList');
				
                if ( ! ( Array.isArray(jobfiles) && jobfiles.length > 0 ) ) {
                    return;
                }

				const select = document.getElementById('jobfilename');

				if ( ! select ) {
					throw new Error('jobfilename dropdown not found');
				}
				
                jobfiles.forEach( jobfile => {
                    console.log("jobfile: " + jobfile);
                    					
                    const newOption = new Option(jobfile, jobfile);
                    select.add(newOption);
                });

                select.selectedIndex = 0;				
            }
            
            function initClientList(clients) {
                const select = document.getElementById('clientidlist');

                let tclientid = [];
                
                Object.keys(clients).forEach( key => {
                    let client = clients[key];
                    
                    tclientid.push(client["ClientID"]);
                });
                
                tclientid.sort((a,b) => a.localeCompare(b) );

                tclientid.forEach(clientid => { 
                    const newOption = new Option(clientid, clientid);
                    select.add(newOption);
                });            
                
                select.selectedIndex = 0;
            }

            function init() {
                const xhr = new XMLHttpRequest();

                xhr.open('GET', mothershipurl, false);

                try {
                    xhr.send();

                    if ( xhr.status === 200 ) {

                        data = JSON.parse(xhr.responseText);
                        
                        clientaccess = data["clientaccess"];
                        clientjobs = data["clientjobs"];
                        jobfiles = data["jobfileslist"];
                        cmds = data["cmds"];

                        console.log(data); 

                    } else {
                        console.error(`Error ${xhr.status}: ${xhr.statusText}`);
                    }
                } catch (error) {
                    console.error("Request failed:", error);
                }

            }
		</script>

        <script>
            init();
            
            clientaccess = clientaccess.filter( client => {
                const value = client["SessionDT"];
                
                return value !== null && typeof value === 'string' && value.trim() !== "";
            });

            clientaccess = clientaccess.sort((a,b) => b["SessionDT"].localeCompare(a["SessionDT"]) );

            clientaccess.forEach(client => { 
                delete client.LoggerRowID; 
                delete client.SessionID;
                delete client.LogID;
            });

            initClientList(clientaccess);
            
            updateClientJobsTable();

            let highlighter = function(newRow, row) {
                    let sessionDt = ( new Date(row["SessionDT"]) ); // 2026-04-07 20:07:02
                    const diffInMs = Math.abs(Date.now()+4*60*60*1000 - sessionDt.getTime());
                    const diffInMsA = Math.abs(Date.now() - sessionDt.getTime());
                    //console.log(row["ClientID"] + " - diffInMs: " + diffInMs);
					//console.log(row["ClientID"] + " - diffInMs: " + diffInMsA);
                    const fiveMinutesInMs = 5 * 60 * 1000;

                    if ( (diffInMs <= fiveMinutesInMs) || (diffInMsA <= fiveMinutesInMs )) {
                        newRow.classList.add("highlight-active");
                    }
            }
                               
            try {
                populateTable("clientaccess", clientaccess, highlighter);

                initJobFilesList(jobfiles);

                initCmdsList(cmds);
            } catch (error) {
                console.log("exception stack: " + error.stack);
                console.log("exception name: ", error.name);       
                console.log("exception message: ", error.message);             
            }
            
        </script>
